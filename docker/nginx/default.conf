# Docker's DNS: upstreams are looked up per request (through variables below),
# so nginx starts before php/reverb and follows them if they restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    # Not for search engines (robots.txt says the same).
    add_header X-Robots-Tag "noindex, nofollow" always;

    set $php_upstream php:9000;
    set $reverb_upstream http://reverb:8080;

    # Reverb's WebSocket endpoint (/app/<key>) on the same origin as the app:
    # one domain to configure, no CORS, and the images work on any host.
    location /app/ {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Vite's fingerprinted assets never change under the same name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Only the front controller runs; no other PHP file is reachable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

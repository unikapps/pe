; Overrides for the default [www] pool (loaded after the image's own files).
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Recycle each worker process after 500 requests, so any slow memory growth
; (an extension, fragmentation) is capped instead of building up.
pm.max_requests = 500

; Keep the container's environment variables visible to PHP.
clear_env = no

; Loaded on top of php.ini-production.

expose_php = Off
memory_limit = 256M

; The source is baked into the image and never changes under a running
; container, so OPcache never needs to re-check file timestamps.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
